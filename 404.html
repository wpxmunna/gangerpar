<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>পাতাটা নেই — গাঙের পাড়</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f7f4ea" />
    <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <style>
      /* No river on this page, so the content starts where the logo does. */
      .lost {
        min-height: 66vh;
        display: grid;
        align-content: center;
      }
      .lost__inner {
        width: 100%;
        max-width: var(--shell);
        margin-inline: auto;
        padding-inline: var(--pad);
      }
      .lost h1 {
        font-size: clamp(2rem, 1.2rem + 3.4vw, 3.4rem);
      }
    </style>
  </head>

  <body>
    <header class="masthead">
      <div class="masthead__inner">
        <a class="brand" href="./" aria-label="গাঙের পাড়, প্রথম পাতা">
          <img
            src="assets/img/logo-lockup.png"
            width="584"
            height="180"
            alt="গাঙের পাড় — অর্গানিক প্রোডাক্টস"
          />
        </a>
        <p class="flag">শীঘ্রই আসছে</p>
      </div>
    </header>

    <main class="lost">
      <div class="lost__inner">
        <h1>এই পাতাটা নেই</h1>
        <p class="lead">
          ঠিকানাটা বোধহয় ভুল, নয়তো পাতাটা সরে গেছে। আমাদের গোটা বাজারটাই এখন এক পাতায় —
          সেখান থেকেই শুরু করুন।
        </p>
        <p class="actions">
          <a class="btn" href="./">প্রথম পাতায় ফিরুন</a>
        </p>
      </div>
    </main>

    <footer class="foot">
      <div class="lost__inner">
        <p class="foot__rule" style="margin-top: 0; border-top: 0; padding-top: 0">
          © ২০২৬ গাঙের পাড়। বাজার খোলার অপেক্ষায়।
        </p>
      </div>
    </footer>
  </body>
</html>
